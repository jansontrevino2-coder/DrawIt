<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawIt</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><b>✏️ DrawIt</b><button id="logout" hidden>Sign out</button></header><main><div id="msg"></div><section id="auth"><h1>Welcome to DrawIt</h1><input id="username" placeholder="Username"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signup">Create account</button><button id="login">Log in</button></section><section id="app" hidden><div class="composer"><textarea id="post" maxlength="500" placeholder="What's on your mind?"></textarea><button id="send">Post</button></div><div id="feed"></div></section></main><script src="app.js"></script></body></html>
