<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DrawIt</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            <div class="logo-icon">✏️</div>
            <span>DrawIt</span>
        </div>

        <button id="logoutButton" class="small-button hidden">
            Sign Out
        </button>

    </div>
</header>

<main>

    <div id="message"></div>

    <!-- LOGIN PAGE -->

    <section id="authPage" class="auth-card">

        <div class="auth-logo">✏️</div>

        <h1>Welcome to DrawIt</h1>

        <p>
            Post your thoughts and reply to people
            using text or drawings.
        </p>

        <input
            id="usernameInput"
            maxlength="30"
            placeholder="Username"
        >

        <input
            id="emailInput"
            type="email"
            placeholder="Email"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Password"
        >

        <button id="signupButton" class="primary full">
            Create Account
        </button>

        <button id="loginButton" class="secondary full">
            Log In
        </button>

    </section>

    <!-- MAIN APP -->

    <section id="appPage" class="hidden">

        <!-- FEED -->

        <div id="feedPage" class="page active">

            <div class="page-title">
                <h1>Feed</h1>
                <p>See what everyone is posting.</p>
            </div>

            <section class="composer">

                <textarea
                    id="postInput"
                    maxlength="500"
                    placeholder="What's on your mind?"
                ></textarea>

                <div class="composer-bottom">

                    <span id="counter">
                        0 / 500
                    </span>

                    <button id="postButton" class="primary">
                        Post
                    </button>

                </div>

            </section>

            <div id="feed"></div>

        </div>

        <!-- DRAW PAGE -->

        <div id="drawPage" class="page">

            <div class="page-title">
                <h1>🎨 Draw</h1>

                <p>
                    Draw a reply to a post.
                </p>
            </div>

            <section class="drawing-card">

                <div id="selectedPostBox" class="selected-post">

                    <div class="selected-label">
                        Replying to
                    </div>

                    <div id="selectedPostContent">
                        Select a post from the Feed first.
                    </div>

                </div>

                <div class="drawing-toolbar">

                    <div class="tool-group">

                        <span>Color</span>

                        <input
                            id="brushColor"
                            type="color"
                            value="#111111"
                        >

                    </div>

                    <div class="tool-group brush-slider">

                        <span>Size</span>

                        <input
                            id="brushSize"
                            type="range"
                            min="2"
                            max="40"
                            value="6"
                        >

                    </div>

                    <button
                        id="eraserButton"
                        class="tool-button"
                    >
                        🧽 Eraser
                    </button>

                    <button
                        id="undoButton"
                        class="tool-button"
                    >
                        ↶ Undo
                    </button>

                    <button
                        id="clearButton"
                        class="tool-button danger"
                    >
                        Clear
                    </button>

                </div>

                <div class="canvas-container">

                    <canvas id="drawingCanvas"></canvas>

                </div>

                <div class="drawing-bottom">

                    <button
                        id="cancelDrawingButton"
                        class="secondary"
                    >
                        Cancel
                    </button>

                    <button
                        id="postDrawingButton"
                        class="primary"
                    >
                        Post Drawing
                    </button>

                </div>

            </section>

        </div>

    </section>

</main>

<!-- NAVIGATION -->

<nav id="bottomNav" class="bottom-nav hidden">

    <button
        id="feedNav"
        class="nav-button active"
        data-page="feed"
    >
        <span>🏠</span>
        <small>Feed</small>
    </button>

    <button
        id="drawNav"
        class="nav-button"
        data-page="draw"
    >
        <span>🎨</span>
        <small>Draw</small>
    </button>

</nav>

<script src="app.js"></script>

</body>
</html>
